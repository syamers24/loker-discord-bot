name: LinkedIn Job Scraper Bot

on:
  schedule:
    # Berjalan otomatis setiap 4 jam sekali
    - cron: '0 */4 * * *'
  # Memungkinkan Anda menjalankan bot ini secara manual kapan saja
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Job Scraper Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python job_bot.py

      - name: Commit & Push Updated seen_jobs.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json
          git commit -m "update: seen_jobs.json [skip ci]" || exit 0
          git push
